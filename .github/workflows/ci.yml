name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: 守卫测试
        run: bash tests/run.sh

      - name: 清单与结构校验
        run: python3 tests/check.py

      - name: check.py 咬合自测
        run: python3 tests/test_check_bites.py

      - name: 判题记录
        run: python3 tests/test_records.py

      - name: 错题本 SM-2
        run: python3 tests/test_notebook.py

      - name: 数学机验
        run: |
          pip install --quiet 'sympy==1.13.3'
          python3 tests/test_verify.py

      - name: 错题本脚本冒烟测试
        run: |
          pip install --quiet openpyxl
          GEN="$PWD/skills/high-school-ai-tutor/templates/wrong-notebook-generator.py"
          EXAMPLE="$PWD/skills/high-school-ai-tutor/templates/entry-example.json"
          TMP="$(mktemp -d)"
          cp "$EXAMPLE" "$TMP/e.json"
          cd "$TMP"
          python3 "$GEN" add e.json --db "$TMP/tutor.db"
          python3 - <<'EOF'
          from openpyxl import load_workbook
          wb = load_workbook("错题本.xlsx")
          assert wb["错题记录"].max_row == 2, "新增条目后记录表应有 2 行"
          plan = wb["复习计划"]
          assert plan.max_row == 2, "复习计划表应有 2 行"
          assert plan.cell(row=1, column=4).value == "下次复习"
          assert plan.cell(row=2, column=4).value == "2026-09-24"
          assert wb["统计看板"].cell(row=2, column=2).value.startswith("=COUNTA"), "统计公式缺失"
          print("错题本冒烟测试 OK")
          EOF
